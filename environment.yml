# Conda environment for the reward-steered FLUX sampling experiments
# (src/run_sweep.py, src/control_loops.py, src/image_conicflow.py).
#
# Create:
#   conda env create -f environment.yml
#   conda activate flowmaps
#
# Then clone FMRG and fetch its FLUX FlowMap LoRA weights, which are NOT
# vendored in this release (see README section 2):
#   git clone https://github.com/jrrhuang/fmrg.git
#   bash fmrg/checkpoints_download.sh
#
# After activating:
#   export HF_TOKEN=hf_...            # required for the gated FLUX.1-dev
#   export HF_HUB_DISABLE_XET=1       # recommended
#   export FMRG_DIR=/path/to/fmrg     # no default; must be set
#
# FLOW_MATCHING_DIR does NOT need to be set: image_conicflow.py is vendored in src/
# and that is where run_sweep.py looks by default.
#
# The optional reward backends (ImageReward, HPSv2) need the post-install step
# in fmrg/install.sh.

name: flowmaps
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
      # ── PyTorch (CUDA 12.1) ────────────────────────────────────────────────
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - triton==3.1.0

      # ── FLUX / diffusion ─────────────────────────────────────────────────
      - diffusers==0.34.0
      - transformers>=4.41.2,<4.54
      - accelerate==1.12.0
      - peft>=0.15.0,<0.18
      - sentencepiece
      - safetensors>=0.4.0
      - huggingface-hub>=0.23.0,<0.35.0

      # ── Quantization (run_sweep.py --quantize int8/int4/nf4) ─────────────
      - torchao==0.9.0
      - bitsandbytes>=0.43.0

      # ── Scientific / plotting ────────────────────────────────────────────
      - numpy>=1.26,<3
      - scipy>=1.11
      - matplotlib>=3.8
      - pandas>=2.0
      - pillow>=10.0
      - tqdm
      - einops
      - ftfy
      - regex
      - protobuf>=4.21.6      # tensorflow (below) requires >=5, uncapped here
      - scikit-learn>=1.3

      # ── Config / utilities ───────────────────────────────────────────────
      - pyyaml>=6.0
      - hydra-core>=1.3
      - omegaconf>=2.3
      - setuptools<70          # pkg_resources needed by CLIP / reward installs

      # ── Metrics (fmrg scripts) ───────────────────────────────────────────
      - torchmetrics>=1.3,<1.4
      - lpips>=0.1.4
      - scikit-image

      # ── Flow-map notebook + training (flow_map_tests.ipynb, py/launchers/learn.py) ──
      # torchcfm: conditional-flow-matching losses / OT couplings
      # flax + jax[cuda12]: JAX/Flax flow-map training and checkpoint (de)serialization.
      #   GPU jaxlib is required for py/launchers/learn.py (uses jax.pmap across all
      #   local GPUs); the notebook itself only needs msgpack_restore (CPU is enough
      #   there, but training and the notebook share this env).
      #   NOTE: pulls in nvidia-cudnn-cu12 >9.1.0.70, newer than the version torch
      #   above pins. In practice both torch and jax load the newer cuDNN fine
      #   (verified with conv2d fwd/bwd on GPU + jax.devices() detecting all GPUs),
      #   so this is left unpinned rather than forcing a downgrade.
      #
      #   *** THE NOTE ABOVE NO LONGER DESCRIBES THIS ENV (measured 2026-09-17). ***
      #   The `flowmaps` env as it actually exists has nvidia-cudnn-cu12 9.1.0.70 --
      #   torch's pin, NOT the newer one -- and its JAX is consequently BROKEN:
      #
      #       >>> import jax.numpy as jnp; jnp.ones((256, 256))
      #       E cuda_dnn.cc:523] Loaded runtime CuDNN library: 9.1.0 but source was
      #       compiled with: 9.8.0. CuDNN library needs to have matching major
      #       version and equal or higher minor version.
      #
      #   It fails on array creation, so nothing JAX-side runs at all:
      #   flow-maps/py/launchers/learn.py cannot work in this env today.
      #
      #   WHY THE NOTE WENT STALE. pip has no resolver, so whichever of torch and
      #   jax[cuda12] is installed last wins the cuDNN slot. The verification above
      #   was presumably done when jax had just been installed; any later `pip
      #   install torch` (a reinstall, a repair step, an `--upgrade` touching it)
      #   silently pins cuDNN back to 9.1.0.70 and takes JAX down with it, with no
      #   error until something actually calls into JAX. Nothing in this file can
      #   prevent that -- the two requirements are genuinely unsatisfiable together:
      #       torch 2.5.1  requires nvidia-cudnn-cu12 == 9.1.0.70
      #       jax  >= 0.6  is built against cuDNN 9.8
      #
      #   HOW IT WAS FOUND, AND THE FIX. `uv lock` refuses the combination outright
      #   rather than installing one over the other, which is how the breakage
      #   surfaced. The uv setup therefore keeps them in SEPARATE environments:
      #   pyproject.toml / uv.lock hold the torch sweep stack (no jax, no TF), and
      #   requirements-flowmaps-training.txt holds the JAX/Flax/TF training stack
      #   for its own venv. See scripts/uv_postinstall.sh.
      #
      #   If you keep using this conda env for JAX training, install jax[cuda12]
      #   LAST and re-check `jax.numpy.ones((8,8))` afterwards -- `jax.devices()`
      #   alone passes even when the runtime is broken, which is part of why this
      #   went unnoticed.
      # tensorflow / tensorflow-datasets / ml_collections: transitive imports pulled
      #   in by flow-maps/py/common/datasets.py (sample_two_moons)
      # seaborn / wandb: used by flow-maps/py/common/logging.py during training
      - torchcfm==1.0.7
      - flax>=0.10
      - jax[cuda12]>=0.6
      - tensorflow>=2.15
      - tensorflow-datasets>=4.9
      - ml-collections>=1.1
      - seaborn>=0.13
      - wandb>=0.16.5

      # ── GitHub CLI (optional, for repo management) ───────────────────────
      # - gh  # install via: conda install -c conda-forge gh

# ── Known post-install fix: libstdc++ ABI mismatch ───────────────────────────
# scipy (imported via sklearn -> common/datasets.py) is built against a newer
# libstdc++ (CXXABI_1.3.15) than the system one at /lib/x86_64-linux-gnu, but
# conda already ships a compatible libstdc++ under $CONDA_PREFIX/lib. Without
# this, `import scipy.spatial` fails with:
#   ImportError: /lib/x86_64-linux-gnu/libstdc++.so.6: version `CXXABI_1.3.15' not found
# Fix (one-time, per env) — add a conda activate hook so it's picked up automatically:
#   mkdir -p $CONDA_PREFIX/etc/conda/activate.d $CONDA_PREFIX/etc/conda/deactivate.d
#   printf 'export _FLOWMAPS_OLD_LD_LIBRARY_PATH="$LD_LIBRARY_PATH"\nexport LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"\n' \
#     > $CONDA_PREFIX/etc/conda/activate.d/libstdcxx_fix.sh
#   printf 'export LD_LIBRARY_PATH="$_FLOWMAPS_OLD_LD_LIBRARY_PATH"\nunset _FLOWMAPS_OLD_LD_LIBRARY_PATH\n' \
#     > $CONDA_PREFIX/etc/conda/deactivate.d/libstdcxx_fix.sh
#   (then `conda deactivate && conda activate flowmaps` to pick it up)
