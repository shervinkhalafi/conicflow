[project]
name = "fmocc"
version = "0.1.0"
description = "Optimization-based control for FLUX flow-map image generation (MPC / HardFlow / FMRG)"
requires-python = "==3.10.*"

# Mirrors the `flowmaps` conda env. Only DIRECT dependencies are listed; uv.lock
# pins the full transitive closure, and the lockfile is what makes two machines
# identical. Versions are pinned where the env is known-good and the pin matters
# (torch/torchao/diffusers/transformers all participate in the quantized FLUX
# path), and left open where they do not.
dependencies = [
    # ── FLUX sampling + quantization ──────────────────────────────────────
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchao==0.9.0",            # int8/int4 weight-only quantization
    "diffusers==0.34.0",
    "transformers==4.53.3",
    # Upper cap is scripts/setup_reward_models.sh's, kept: the conda env runs
    # 0.17.1 and matching it is the point of this file.
    "peft>=0.15.0,<0.18",        # FlowMap LoRA
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "sentencepiece>=0.2",        # T5 tokenizer
    "protobuf>=5",               # T5 tokenizer conversion; TF needs >=5, so uncapped
    "bitsandbytes>=0.45",        # --quantize nf4
    "einops>=0.8",
    # Imported at runtime by parts of the stack that still use pkg_resources
    # (conda/pip put it in every env by default; a uv venv does not).
    "setuptools>=68",

    # ── Reward models ─────────────────────────────────────────────────────
    "image-reward==1.5",
    "hpsv2==1.2.0",
    "clip",                      # openai/CLIP, pinned by rev in [tool.uv.sources]
    "lpips>=0.1.4",
    "ftfy>=6",
    "regex",
    "fairscale>=0.4",            # required by image-reward's BLIP backbone
    "timm>=1.0",                 # required by hpsv2 / open_clip

    # ── Numerics, IO, plotting ────────────────────────────────────────────
    "numpy>=2.0,<3",
    "scipy>=1.15",
    "matplotlib>=3.9",
    "pillow>=10",
    "tqdm>=4.66",
    "pyyaml>=6",
    "requests>=2.31",
    "scikit-image>=0.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# torch-side extras for the 2D experiments in lowdim/. Safe alongside the core
# stack -- no jax, no tensorflow, so torch keeps the cuDNN it pins.
lowdim = [
    "torchcfm==1.0.7",
    "pytorch-lightning>=2.0",
    "torchmetrics>=1.0",
    "seaborn>=0.13",
    "wandb>=0.16.5",
]
notebooks = ["jupyterlab>=4", "ipywidgets>=8", "ipykernel>=6"]
dev = ["pytest>=7"]

# DELIBERATELY ABSENT: jax / flax / optax / tensorflow, i.e. the flow-map
# TRAINING stack for flow-maps/py/launchers/learn.py. They cannot share a
# resolved environment with torch 2.5.1:
#   torch 2.5.1  requires nvidia-cudnn-cu12 == 9.1.0.70
#   jax  >= 0.6  is built against cuDNN 9.8
# pip/conda hide this by installing one over the other with no resolver; uv
# refuses, which is the correct behaviour and how the breakage below was found.
# The flowmaps conda env has cuDNN 9.1.0.70 (torch's pin) and its jax is
# therefore BROKEN -- `jnp.ones((256,256))` fails with
#   "Loaded runtime CuDNN library: 9.1.0 but source was compiled with: 9.8.0"
# despite environment.yml claiming the combination was verified. Forcing the
# newer cuDNN to satisfy jax would hand torch a version it does not pin, on the
# exact path every sweep runs. So the training stack gets its OWN venv:
# see requirements-flowmaps-training.txt.

[tool.uv]
# Dependency pins that are WRONG and that the working conda env already
# contradicts. `pip install --no-build-isolation` (what scripts/setup_reward_models.sh
# does) simply ignores these, then the script force-reinstalls the real versions
# afterwards -- the "repair pins pulled in by image-reward / hpsv2" step. uv
# resolves everything together instead, so the bad pins have to be stated as
# overrides rather than repaired after the fact. Each one is justified by the
# conda env running the newer version successfully:
#   hpsv2 1.2.0 declares protobuf<4; flowmaps runs protobuf 6.32.0.
#     (TensorFlow requires >=5, so <4 is not merely stale, it is unsatisfiable
#      alongside the flowmaps extra.)
#   image-reward 1.5 declares timm==0.6.13; flowmaps runs timm 1.0.28, which is
#     also what hpsv2's open_clip backbone needs.
#   image-reward 1.5 also drags in datasets 2.14.4, which is broken against any
#     modern pyarrow ("module 'pyarrow' has no attribute 'PyExtensionType'") and
#     so fails at `import ImageReward`. flowmaps runs datasets 5.0.1.
override-dependencies = [
    "protobuf>=5",
    "timm>=1.0",
    "datasets>=5",
]

# torch/torchvision come from the CUDA 12.1 index, everything else from PyPI.
# `explicit = true` means ONLY the packages routed there in [tool.uv.sources]
# use it -- without it uv would look for every package on that index.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
# openai/CLIP is not on PyPI. Pinned to the exact rev the flowmaps env has, so
# the lockfile is reproducible rather than tracking whatever main points at.
clip = { git = "https://github.com/openai/CLIP.git", rev = "d05afc436d78f1c48dc0dbf8e5980a9d471f35f6" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The repo is a collection of scripts, not an importable package; this keeps
# `uv sync` from trying to build a wheel layout that does not exist.
bypass-selection = true
